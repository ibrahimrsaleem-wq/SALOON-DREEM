name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Test backend API and business rules
        run: python -m pytest -q
      - name: Compile Python source
        run: python -m compileall -q backend server.py
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install JavaScript build dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check and rebuild the browser app
        run: npm run check:types && npm run build:web && npm run check:js
      - name: Ensure generated browser file is in sync
        run: git diff --exit-code -- frontend/app.js
