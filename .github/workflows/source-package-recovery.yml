name: Recover source archive payloads

on:
  push:
    branches:
      - audit/package-validation-1.2.0
    paths:
      - '.source-package/**'
      - 'restore-package-1.2.0/**'
      - 'restore-package-1.2.0-verified/**'
      - '.github/workflows/source-package-recovery.yml'
  workflow_dispatch:

concurrency:
  group: source-recovery-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  salvage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode source transfers without hiding corruption
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics-recovery
          python - <<'PY'
          from pathlib import Path
          import base64, re

          out = Path("diagnostics-recovery")
          report = []
          def join_parts(paths):
              return "".join(p.read_text(encoding="ascii").strip() for p in paths)

          root = Path(".source-package")
          main_parts = []
          for i in range(19):
              num = f"{i:03d}"
              replacements = sorted((root / "repair").glob(f"part-{num}-*.b64"))
              paths = replacements if replacements else [root / f"part-{num}.b64"]
              if not all(p.exists() for p in paths):
                  report.append(f"MAIN 1.1.0 missing part {num}")
                  continue
              main_parts.extend(paths)
          main_text = join_parts(main_parts)
          report.append(f"MAIN 1.1.0 chars={len(main_text)} remainder={len(main_text)%4}; segments={len(main_parts)}")

          sources = [
              ("main-1.1.0", main_text),
              ("package-1.2.0", join_parts(sorted(Path("restore-package-1.2.0").glob("part-*.b64")))),
              ("verified-1.2.0", join_parts(sorted(Path("restore-package-1.2.0-verified").glob("part-*.b64")))),
          ]
          for label, raw_text in sources:
              text = re.sub(r"\s+", "", raw_text)
              if not re.fullmatch(r"[A-Za-z0-9+/=]*", text):
                  report.append(f"{label}: skipped (invalid Base64 character)")
                  continue
              variants = []
              if len(text) % 4 == 1:
                  variants.extend([(f"{label}-drop-last-char", text[:-1]), (f"{label}-drop-first-char", text[1:])])
              else:
                  variants.append((label, text))
              for variant_label, encoded in variants:
                  padded = encoded + ("=" * ((-len(encoded)) % 4))
                  try:
                      payload = base64.b64decode(padded, validate=True)
                      target = out / f"{variant_label}.damaged.zip"
                      target.write_bytes(payload)
                      report.append(f"{variant_label}: decoded bytes={len(payload)} chars={len(encoded)}")
                  except Exception as exc:
                      report.append(f"{variant_label}: decode failed: {exc}")
          (out / "decode-report.txt").write_text("\n".join(report) + "\n", encoding="utf-8")
          print("\n".join(report))
          PY

      - name: Recover ZIP directory and extract CRC-valid entries only
        shell: bash
        run: |
          set -u
          shopt -s nullglob
          for candidate in diagnostics-recovery/*.damaged.zip; do
            label="$(basename "$candidate" .damaged.zip)"
            repaired="diagnostics-recovery/$label.recovered.zip"
            log="diagnostics-recovery/$label-repair.log"
            echo "=== Attempting ZIP recovery: $label ==="
            (timeout 30s bash -c 'yes | zip -FF "$1" --out "$2"' _ "$candidate" "$repaired" >"$log" 2>&1 || true)
            cat "$log" || true
          done

          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, json, zlib, zipfile

          output = Path("RecoveredSource")
          output.mkdir(exist_ok=True)
          reports = []
          for archive in sorted(Path("diagnostics-recovery").glob("*.recovered.zip")):
              label = archive.name.removesuffix(".recovered.zip")
              target_root = output / label
              try:
                  with zipfile.ZipFile(archive) as zf:
                      members = zf.infolist()
                      ok, bad = 0, []
                      for item in members:
                          if item.is_dir():
                              continue
                          safe = PurePosixPath(item.filename)
                          if safe.is_absolute() or ".." in safe.parts:
                              bad.append({"file": item.filename, "reason": "unsafe path skipped"})
                              continue
                          try:
                              data = zf.read(item)
                              if (zlib.crc32(data) & 0xffffffff) != item.CRC:
                                  raise ValueError("CRC does not match central-directory value")
                              destination = target_root.joinpath(*safe.parts)
                              destination.parent.mkdir(parents=True, exist_ok=True)
                              destination.write_bytes(data)
                              ok += 1
                          except Exception as exc:
                              bad.append({"file": item.filename, "reason": str(exc)})
                      reports.append({
                          "archive": label,
                          "archive_sha256": hashlib.sha256(archive.read_bytes()).hexdigest(),
                          "entries_seen": len(members),
                          "files_recovered_and_crc_verified": ok,
                          "rejected_or_corrupt_files": bad
                      })
              except Exception as exc:
                  reports.append({"archive": label, "fatal_error": str(exc)})
          (output / "RECOVERY-REPORT.json").write_text(json.dumps(reports, indent=2), encoding="utf-8")
          md = ["# SALOON-DREEM source salvage report", "",
                "Only files that could be read and matched their ZIP CRC were preserved. This is a partial forensic recovery, not a complete release package.", ""]
          for report in reports:
              md += [f"## {report.get('archive', 'archive')}",
                     f"- CRC-verified files: {report.get('files_recovered_and_crc_verified', 0)}",
                     f"- Entries seen: {report.get('entries_seen', 0)}",
                     f"- SHA-256 of recovered ZIP: {report.get('archive_sha256', 'unavailable')}",
                     f"- Rejected/corrupt entries: {len(report.get('rejected_or_corrupt_files', []))}", ""]
              for bad in report.get("rejected_or_corrupt_files", []):
                  md.append(f"  - `{bad['file']}`: {bad['reason']}")
          (output / "README-RECOVERY.md").write_text("\n".join(md) + "\n", encoding="utf-8")
          print((output / "README-RECOVERY.md").read_text())
          PY

      - name: Commit only CRC-verified source files to this audit branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RecoveredSource
          if git diff --cached --quiet; then
            echo "No CRC-verified files were recoverable."
            exit 0
          fi
          git commit -m "recovery: preserve individually CRC-verified source files [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
