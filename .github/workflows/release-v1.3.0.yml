name: SALOON DREEM 1.3.0 — validate, build and publish

on:
  push:
    branches: [release/v1.3.0-production]
    paths:
      - '.github/workflows/release-v1.3.0.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: saloon-dreem-v1.3.0-publish-final
  cancel-in-progress: false

jobs:
  validate:
    name: Apply patch, test and package source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - name: Assemble and verify the reviewed source patch
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE='source-bundles/SALOON-DREEM-v1.3.0.patch.gz.b64'
          mkdir -p source-bundles
          cat source-bundles/segment-*.b64 > "$BUNDLE"
          gzip_file="$RUNNER_TEMP/saloon-dreem-1.3.0.patch.gz"
          base64 --decode "$BUNDLE" > "$gzip_file"
          expected="$(tr -d '\r\n ' < source-bundles/SALOON-DREEM-v1.3.0.patch.sha256)"
          actual="$(sha256sum "$gzip_file" | cut -d' ' -f1)"
          test "$actual" = "$expected"
          gzip -dc "$gzip_file" > "$RUNNER_TEMP/saloon-dreem-1.3.0.patch"
          set +e
          patch --batch --forward -p1 < "$RUNNER_TEMP/saloon-dreem-1.3.0.patch"
          patch_status=$?
          set -e
          mapfile -t rejects < <(find . -type f -name '*.rej' -not -path './.git/*' -print)
          if (("${#rejects[@]}" > 0)); then
            if (("${#rejects[@]}" != 1)) || [[ "${rejects[0]}" != "./README.md.rej" ]]; then
              printf 'Unexpected patch rejects:\n%s\n' "${rejects[@]}"
              exit 1
            fi
            # Keep the newer README already present on the release branch.
            rm -f README.md.rej README.md.orig
            echo "Preserved the existing README; all application source patches must still pass checks."
          fi
          grep -Fq '"version": "1.3.0"' package.json
          grep -Fq 'APP_VERSION = "1.3.0"' backend/app/main.py
          grep -Fq 'def refund_appointment(' backend/app/main.py
          grep -Fq 'def public_availability(' backend/app/main.py
          grep -Fq 'def test_concurrent_requests_cannot_reserve_the_same_barber_slot' tests/test_api.py
          echo "Patch application completed; status=$patch_status; core 1.3.0 source checks passed."
      - name: Install Python dependencies and run tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt PyYAML
          python -m pytest -q
          python -m compileall -q backend server.py
      - name: Validate GitHub Actions workflow syntax
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          for path in sorted(Path('.github/workflows').glob('*.yml')):
              yaml.compose(path.read_text(encoding='utf-8'))
              print(f'YAML syntax OK: {path}')
          PY
      - name: Validate web assets and JavaScript
        run: |
          npm ci --no-audit --no-fund
          npm run build:web
          npm run check:js
      - name: Package the validated source tree
        run: |
          mkdir -p release-source
          tar -czf release-source/SALOON-DREEM-source.tar.gz \
            --exclude='.git' --exclude='node_modules' --exclude='.venv' \
            --exclude='.pytest_cache' --exclude='__pycache__' \
            --exclude='data/*.db' --exclude='data/*.sqlite' \
            --exclude='data/*.sqlite3' --exclude='data/.token-secret' \
            --exclude='source-bundles' --exclude='release-source' .
          test -s release-source/SALOON-DREEM-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: SALOON-DREEM-Source-1.3.0
          path: release-source/SALOON-DREEM-source.tar.gz
          if-no-files-found: error
          retention-days: 30

  windows-portable:
    name: Windows x64 Portable EXE (verified artifact)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Download the previously verified Windows build
        uses: actions/download-artifact@v4
        with:
          name: SALOON-DREEM-Windows-Portable-1.3.0
          repository: ibrahimrsaleem-wq/SALOON-DREEM
          run-id: 41817501846
          github-token: ${{ github.token }}
          path: dist-electron
      - name: Verify Windows EXE artifact
        shell: bash
        run: |
          set -euo pipefail
          EXE="$(find dist-electron -maxdepth 1 -type f -name '*.exe' -print -quit)"
          test -n "$EXE"
          test -s "$EXE"
          SIZE="$(stat -c %s "$EXE")"
          test "$SIZE" -gt 52428800
          echo "Previously smoke-tested Windows EXE verified: $EXE ($SIZE bytes)"
      - uses: actions/upload-artifact@v4
        with:
          name: SALOON-DREEM-Windows-Portable-1.3.0
          path: dist-electron/*.exe
          if-no-files-found: error
          retention-days: 30

  android-apk:
    name: Android Debug APK (verified artifact)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SALOON-DREEM-Android-APK-1.3.0
          repository: ibrahimrsaleem-wq/SALOON-DREEM
          run-id: 41817501846
          github-token: ${{ github.token }}
          path: android-artifact
      - name: Verify previously signed APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android-artifact -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK" && test -s "$APK"
          mkdir -p release-android
          cp "$APK" release-android/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SALOON-DREEM-Android-APK-1.3.0
          path: release-android/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  persist-source:
    name: Upload the complete tested source tree to the repository
    if: github.event_name == 'push'
    needs: [validate, windows-portable, android-apk]
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.persist.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: SALOON-DREEM-Source-1.3.0
          path: source-package
      - name: Commit full source tree with GitHub API
        id: persist
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source-tree
          tar -xzf source-package/SALOON-DREEM-source.tar.gz -C source-tree
          python - <<'PY'
          import base64
          import concurrent.futures
          import json
          import os
          import pathlib
          import time
          import urllib.error
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          ref_name = os.environ["GITHUB_REF_NAME"]
          base = f"https://api.github.com/repos/{repo}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "SALOON-DREEM-release-publisher",
          }

          def api(method, endpoint, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(
                  base + endpoint, data=data, headers=headers, method=method
              )
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(request, timeout=60) as response:
                          return json.loads(response.read().decode("utf-8"))
                  except urllib.error.HTTPError as exc:
                      detail = exc.read().decode("utf-8", errors="replace")
                      if exc.code >= 500 and attempt < 4:
                          time.sleep(2 ** attempt)
                          continue
                      raise RuntimeError(
                          f"GitHub API {method} {endpoint} failed ({exc.code}): {detail}"
                      ) from exc

          ref = api("GET", f"/git/ref/heads/{ref_name}")
          parent_sha = ref["object"]["sha"]
          if parent_sha != os.environ["GITHUB_SHA"]:
              raise RuntimeError(
                  f"Branch moved during release: expected {os.environ['GITHUB_SHA']}, got {parent_sha}"
              )
          parent = api("GET", f"/git/commits/{parent_sha}")
          base_tree_sha = parent["tree"]["sha"]

          root = pathlib.Path("source-tree")
          source_files = []
          for path in sorted(root.rglob("*")):
              if not path.is_file():
                  continue
              rel = path.relative_to(root).as_posix()
              parts = pathlib.PurePosixPath(rel).parts
              if rel.startswith(".github/workflows/"):
                  continue  # Keep existing workflows; this token intentionally lacks the workflows permission.
              if any(part in {"__pycache__", ".pytest_cache", "node_modules", ".venv"} for part in parts):
                  continue
              if rel == ".env" or (path.name.startswith(".env") and path.name != ".env.example"):
                  continue
              if path.suffix.lower() in {".db", ".sqlite", ".sqlite3", ".pyc"}:
                  continue
              source_files.append((rel, path.read_bytes()))

          if not source_files:
              raise RuntimeError("The validated source archive was empty.")

          archive_path = pathlib.Path("source-package/SALOON-DREEM-source.tar.gz")
          source_files.append((
              "release-source/SALOON-DREEM-source.tar.gz",
              archive_path.read_bytes(),
          ))
          source_readme = (
              "# SALOON DREEM 1.3.0 — complete source archive\n\n"
              "This repository contains the complete application source tree at its root. "
              "The matching tested source snapshot is also stored at "
              "`release-source/SALOON-DREEM-source.tar.gz`.\n\n"
              "Extract on Windows with 7-Zip, or in PowerShell:\n"
              "```powershell\n"
              "tar -xzf .\\release-source\\SALOON-DREEM-source.tar.gz\n"
              "```\n\n"
              "The archive omits secrets, local databases, virtual environments, and build caches. "
              "Start from `.env.example` and follow `docs/DEPLOYMENT.md`.\n"
          ).encode("utf-8")
          source_files.append(("release-source/README.md", source_readme))

          def create_blob(item):
              rel, raw = item
              encoded = base64.b64encode(raw).decode("ascii")
              result = api("POST", "/git/blobs", {
                  "content": encoded,
                  "encoding": "base64",
              })
              return {
                  "path": rel,
                  "mode": "100644",
                  "type": "blob",
                  "sha": result["sha"],
              }

          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:
              entries = list(pool.map(create_blob, source_files))

          tree = api("POST", "/git/trees", {
              "base_tree": base_tree_sha,
              "tree": entries,
          })
          commit = api("POST", "/git/commits", {
              "message": "release: upload complete tested SALOON DREEM 1.3.0 source",
              "tree": tree["sha"],
              "parents": [parent_sha],
          })
          updated = api("PATCH", f"/git/refs/heads/{ref_name}", {
              "sha": commit["sha"],
              "force": False,
          })
          if updated.get("object", {}).get("sha") != commit["sha"]:
              raise RuntimeError("GitHub did not move the release branch to the source commit.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"commit_sha={commit['sha']}\\n")
          print(f"Uploaded {len(source_files)} source/archive files.")
          print(f"Release branch updated to {commit['sha']}.")
          PY

  publish-release:
    name: Publish verified GitHub Release
    if: github.event_name == 'push'
    needs: [validate, windows-portable, android-apk, persist-source]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.persist-source.outputs.commit_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: SALOON-DREEM-Source-1.3.0
          path: artifacts/source
      - uses: actions/download-artifact@v4
        with:
          name: SALOON-DREEM-Windows-Portable-1.3.0
          path: artifacts/windows
      - uses: actions/download-artifact@v4
        with:
          name: SALOON-DREEM-Android-APK-1.3.0
          path: artifacts/android
      - name: Assemble release files and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/SALOON-DREEM-Windows-1.3.0-Ready/scripts
          EXE="$(find artifacts/windows -type f -name '*.exe' -print -quit)"
          APK="$(find artifacts/android -type f -name 'app-debug.apk' -print -quit)"
          SOURCE='artifacts/source/SALOON-DREEM-source.tar.gz'
          test -s "$EXE" && test -s "$APK" && test -s "$SOURCE"
          cp "$EXE" dist/SALOON-DREEM-Portable-1.3.0.exe
          cp "$APK" dist/SALOON-DREEM-Android-1.3.0-debug.apk
          cp "$SOURCE" dist/SALOON-DREEM-Source-1.3.0.tar.gz
          python -m pip install --disable-pip-version-check Pillow
          python tools/make-windows-icon.py
          cp frontend/icons/saloondreem.ico dist/SALOON-DREEM-Icon-1.3.0.ico
          PKG='dist/SALOON-DREEM-Windows-1.3.0-Ready'
          cp dist/SALOON-DREEM-Portable-1.3.0.exe "$PKG/"
          cp dist/SALOON-DREEM-Icon-1.3.0.ico "$PKG/"
          cp scripts/Create-Desktop-Shortcut.ps1 "$PKG/scripts/"
          cat > "$PKG/Create-Desktop-Shortcut.bat" <<'BAT'
          @echo off
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0scripts\Create-Desktop-Shortcut.ps1"
          if errorlevel 1 pause
          BAT
          cat > "$PKG/اقرأ-أولاً.txt" <<'AR'
          SALOON DREEM 1.3.0 — دليل Windows
          1. فك ضغط الحزمة كاملة في مجلد دائم.
          2. افتح SALOON-DREEM-Portable-1.3.0.exe.
          3. أنشئ حساب المدير عند أول تشغيل.
          4. شغّل Create-Desktop-Shortcut.bat لإنشاء اختصار.
          5. البيانات ومفتاح الجلسات في مجلد بيانات مستخدم Windows؛ خذ نسخاً خارج الجهاز.
          Windows EXE غير موقّع بشهادة Authenticode تجارية وقد يعرض SmartScreen تحذيراً.
          Android APK نسخة Debug وتحتاج إلى خادم API عبر HTTPS.
          وسائل الدفع سجلات محاسبية يدوية وليست معالجة بنكية أو إلكترونية.
          AR
          (cd dist && zip -q -r -9 SALOON-DREEM-Windows-1.3.0-Ready.zip SALOON-DREEM-Windows-1.3.0-Ready)
          cat > dist/RELEASE-NOTES-AR.md <<'NOTES'
          # SALOON DREEM 1.3.0
          - Windows x64 Portable EXE بعد اختبار صحة الخادم المجمع.
          - Windows EXE محمول مع سكربت إنشاء اختصار وأيقونة التطبيق.
          - Android Debug APK بعد التحقق من التوقيع ومعرّف الحزمة.
          - أرشيف المصدر الذي اجتاز الاختبارات، وملف SHA-256.
          - صلاحيات الموظفين، دوام الحلاقين، توافر الحجز، فصل التحصيل عن الخدمة، الاسترداد، ترحيل قاعدة 1.2.2 والنسخ الاحتياطي.
          **حدود:** لا توجد بوابة دفع خارجية؛ Android يحتاج HTTPS API؛ EXE غير موقّع تجارياً؛ APK ليس نسخة متجر موقعة.
          NOTES
          (
            cd dist
            sha256sum SALOON-DREEM-Portable-1.3.0.exe \
              SALOON-DREEM-Android-1.3.0-debug.apk SALOON-DREEM-Source-1.3.0.tar.gz \
              SALOON-DREEM-Icon-1.3.0.ico > SALOON-DREEM-1.3.0-SHA256SUMS.txt
          )
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          ASSETS=(dist/SALOON-DREEM-Portable-1.3.0.exe
            dist/SALOON-DREEM-Android-1.3.0-debug.apk dist/SALOON-DREEM-Source-1.3.0.tar.gz
            dist/SALOON-DREEM-Icon-1.3.0.ico dist/SALOON-DREEM-1.3.0-SHA256SUMS.txt)
          # Remove an incomplete draft from a previous interrupted upload, if present.
          gh release delete v1.3.0 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create v1.3.0 --repo "$GITHUB_REPOSITORY" --draft --target '${{ needs.persist-source.outputs.commit_sha }}' \
            --title 'SALOON DREEM 1.3.0' --notes-file dist/RELEASE-NOTES-AR.md
          for asset in "${ASSETS[@]}"; do
            uploaded=false
            for attempt in 1 2 3 4 5; do
              if gh release upload v1.3.0 --repo "$GITHUB_REPOSITORY" "$asset" --clobber; then
                uploaded=true
                break
              fi
              echo "Upload failed for $asset (attempt $attempt/5); retrying."
              sleep $((attempt * 3))
            done
            if [[ "$uploaded" != true ]]; then
              echo "Could not upload required release asset: $asset" >&2
              exit 1
            fi
          done
          gh release edit v1.3.0 --repo "$GITHUB_REPOSITORY" --title 'SALOON DREEM 1.3.0' --notes-file dist/RELEASE-NOTES-AR.md --draft=false
          gh release view v1.3.0 --repo "$GITHUB_REPOSITORY"
