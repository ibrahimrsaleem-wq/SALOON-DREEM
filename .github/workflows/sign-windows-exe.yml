name: Optional Windows Authenticode signing

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag to sign (for example v1.3.0)
        required: true
        default: v1.3.0

permissions:
  contents: write

concurrency:
  group: saloon-dreem-sign-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  sign-and-publish:
    name: Sign the published Windows EXE
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WINDOWS_CODESIGN_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CODESIGN_CERTIFICATE_BASE64 }}
      WINDOWS_CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_CERTIFICATE_PASSWORD }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Validate signing secrets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_CERTIFICATE_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_CERTIFICATE_PASSWORD)) {
            throw 'Signing needs a publicly trusted Authenticode PFX certificate in repository Actions secrets WINDOWS_CODESIGN_CERTIFICATE_BASE64 and WINDOWS_CODESIGN_CERTIFICATE_PASSWORD. The release remains unsigned until these are configured.'
          }

      - name: Download Windows release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern 'SALOON-DREEM-Portable-*.exe' --dir dist
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the portable Windows EXE.' }
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern 'SALOON-DREEM-Windows-*-Ready.zip' --dir dist
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the ready Windows ZIP.' }
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern '*SHA256SUMS.txt' --dir dist
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the release checksums.' }
          $exe = Get-ChildItem -LiteralPath dist -Filter '*.exe' -File | Select-Object -First 1
          $zip = Get-ChildItem -LiteralPath dist -Filter '*Windows-*-Ready.zip' -File | Select-Object -First 1
          $sum = Get-ChildItem -LiteralPath dist -Filter '*SHA256SUMS.txt' -File | Select-Object -First 1
          if ($null -eq $exe -or $null -eq $zip -or $null -eq $sum) { throw 'One or more expected release assets are missing.' }

      - name: Sign and verify the EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $programFilesX86 = [Environment]::GetFolderPath([Environment+SpecialFolder]::ProgramFilesX86)
          $sdkRoot = Join-Path $programFilesX86 'Windows Kits\10\bin'
          $signtool = Get-ChildItem -LiteralPath $sdkRoot -Filter 'signtool.exe' -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $signtool) { throw 'Windows SDK SignTool was not found.' }
          $certPath = Join-Path $env:RUNNER_TEMP 'saloondreem-codesign.pfx'
          try {
            [System.IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_CERTIFICATE_BASE64))
            $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
              $certPath, $env:WINDOWS_CODESIGN_CERTIFICATE_PASSWORD,
              [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet)
            if (-not $cert.HasPrivateKey) { throw 'The PFX certificate has no private key.' }
            $eku = $cert.Extensions | Where-Object { $_ -is [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension] } | Select-Object -First 1
            if ($null -eq $eku -or -not ($eku.EnhancedKeyUsages | Where-Object { $_.Value -eq '1.3.6.1.5.5.7.3.3' })) {
              throw 'The certificate does not contain the Code Signing EKU.'
            }
            if ([DateTime]::UtcNow -lt $cert.NotBefore.ToUniversalTime() -or [DateTime]::UtcNow -gt $cert.NotAfter.ToUniversalTime()) {
              throw 'The code-signing certificate is not currently valid.'
            }
            $cert.Dispose()
            $exe = Get-ChildItem -LiteralPath dist -Filter '*.exe' -File | Select-Object -First 1
            & $signtool.FullName sign /fd SHA256 /f $certPath /p $env:WINDOWS_CODESIGN_CERTIFICATE_PASSWORD /tr 'https://timestamp.digicert.com' /td SHA256 /d 'SALOON DREEM' $exe.FullName
            if ($LASTEXITCODE -ne 0) { throw "SignTool signing failed: $LASTEXITCODE" }
            & $signtool.FullName verify /pa /v $exe.FullName
            if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed: $LASTEXITCODE" }
          } finally {
            Remove-Item -LiteralPath $certPath -Force -ErrorAction SilentlyContinue
          }

      - name: Refresh the ready ZIP and SHA-256 checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem -LiteralPath dist -Filter '*.exe' -File | Select-Object -First 1
          $zip = Get-ChildItem -LiteralPath dist -Filter '*Windows-*-Ready.zip' -File | Select-Object -First 1
          $sum = Get-ChildItem -LiteralPath dist -Filter '*SHA256SUMS.txt' -File | Select-Object -First 1
          $extract = Join-Path $env:RUNNER_TEMP 'saloondreem-ready'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $extract -Force
          $packagedExe = Get-ChildItem -LiteralPath $extract -Filter $exe.Name -Recurse -File | Select-Object -First 1
          if ($null -eq $packagedExe) { throw 'The standalone EXE is missing inside the ready ZIP.' }
          Copy-Item -LiteralPath $exe.FullName -Destination $packagedExe.FullName -Force
          Remove-Item -LiteralPath $zip.FullName -Force
          Compress-Archive -Path (Join-Path $extract '*') -DestinationPath $zip.FullName -CompressionLevel Optimal -Force
          $lines = @((Get-Content -LiteralPath $sum.FullName) | Where-Object { $_ -notmatch [regex]::Escape($exe.Name) -and $_ -notmatch [regex]::Escape($zip.Name) })
          $lines += "$((Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($exe.Name)"
          $lines += "$((Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($zip.Name)"
          Set-Content -LiteralPath $sum.FullName -Value $lines -Encoding ascii

      - name: Publish signed Windows assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem -LiteralPath dist -Filter '*.exe' -File | Select-Object -First 1
          $zip = Get-ChildItem -LiteralPath dist -Filter '*Windows-*-Ready.zip' -File | Select-Object -First 1
          $sum = Get-ChildItem -LiteralPath dist -Filter '*SHA256SUMS.txt' -File | Select-Object -First 1
          gh release upload $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY $exe.FullName $zip.FullName $sum.FullName --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Publishing signed Windows assets failed.' }
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY
